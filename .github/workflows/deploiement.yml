name: Déploiement

# ── CE QUE CE FICHIER FAIT, ET CE QU'IL REFUSE DE FAIRE ──────────────────────
#
# La PRÉPRODUCTION et la PRODUCTION se lancent toutes deux à la main, et la
# seconde est en plus gardée par le portail de mise en ligne. Cette asymétrie est
# la séance 14 tout entière : la boutique a quinze commandes réelles, des noms, des adresses et des
# adresses e-mail de vraies personnes, et elle n'encaisse plus rien depuis
# avril 2025. Le risque ici n'est pas d'interrompre un chiffre d'affaires, c'est
# de détruire un historique qu'on ne peut pas refaire.
#
# CE QUI PART : notre extension et notre thème. Rien d'autre. Jamais
# `wp-content/uploads`, jamais une installation WordPress entière, jamais la
# base. `scripts/deploiement.sh`, côté serveur, n'a d'ailleurs aucun verbe pour
# le faire, et la clé de déploiement ne peut lancer que ce script.
#
# CE QUI NE PART PAS D'ICI : le studio. Il est servi par le Worker Cloudflare, et
# il n'y a qu'UN Worker pour les deux environnements. Un déploiement automatique
# sur un `push` changerait donc ce que voient les clients de la production en même
# temps que la préproduction. Il a son propre travail, manuel, tout en bas, et il
# le restera tant qu'il n'y aura pas un second environnement Worker.
#
# ── LES SECRETS QUE CE FICHIER ATTEND ────────────────────────────────────────
#
#   O2SWITCH_DEPLOY_KEY    la moitié privée de la paire dédiée du 02/09/2026
#   O2SWITCH_HOST          ascaphus.o2switch.net
#   O2SWITCH_USER          dawe4500
#   O2SWITCH_KNOWN_HOSTS   la clé d'hôte, pour ne pas accepter n'importe quel
#                          serveur qui répond à ce nom
#   CLOUDFLARE_API_TOKEN   seulement pour le travail « studio », tout en bas
#
# Aucun n'est dans le dépôt et aucun ne doit y arriver. Comment les poser :
# docs/DEPLOIEMENT.md.

# ── POURQUOI CE FICHIER TOURNE SUR UN EXÉCUTANT AUTO-HÉBERGÉ ─────────────────
#
# Parce qu'un exécutant hébergé par GitHub ne peut pas joindre l'hébergeur, et ne
# le pourra jamais. Mesuré le 02/09/2026 : le déclencheur a tourné pour de vrai,
# a passé toutes les portes, et s'est arrêté sur
#
#   ssh: connect to host *** port 22: Connection timed out
#
# o2switch filtre SSH par adresse IP, cinq au maximum par compte. L'adresse du
# développeur y est ; celle d'un exécutant GitHub, jamais : ces machines sont
# éphémères et tirent leur adresse de plages entières que personne ne peut
# lister. Depuis la machine du développeur, à la même minute, le port 22 répond.
#
# L'exécutant `o2switch-autorise` est donc une machine dont l'adresse EST
# autorisée. C'est sa seule raison d'être, et c'est ce qui rend « une poussée
# livre la préproduction » littéralement vrai plutôt que décoratif.
#
# ── CE QUE CES TRAVAUX NE FONT PLUS : RECOPIER deployer.sh ───────────────────
#
# Ils listaient les mêmes sept étapes que `scripts/deployer.sh`, dans le même
# ordre, en double. Deux écritures d'une même règle finissent toujours par
# diverger, et celle-ci décide ce qui part sur une boutique qui encaisse. Les
# travaux appellent maintenant le script, qui reste la seule description de la
# séquence, et qui s'exécute à l'identique lancé à la main.
#
# Cela a aussi retiré un vrai danger. L'étape « Ouvrir la porte SSH » écrivait
# `~/.ssh/id_ed25519` et ajoutait à `~/.ssh/config`. Inoffensif sur une machine
# jetable ; sur l'exécutant auto-hébergé, c'est le VRAI dossier `.ssh` du
# développeur qui aurait été écrasé à chaque déploiement. L'exécutant utilise sa
# propre configuration SSH, celle qui marche déjà, et n'écrit rien dedans.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cible:
        description: "Où déployer"
        required: true
        type: choice
        default: preprod
        # `studio` est une valeur À PART et non une case à cocher en plus, parce
        # qu'il ne va pas au même endroit : il publie le bundle sur le Worker
        # Cloudflare, dont il n'existe qu'un exemplaire pour les deux
        # environnements. On choisit donc l'un OU l'autre, jamais les deux d'un
        # même geste.
        options: [preprod, prod, studio]
      confirmation:
        description: "Pour « prod » seulement : taper DEPLOYER-EN-PRODUCTION"
        required: false
        default: ""


concurrency:
  # Deux déploiements simultanés sur la même installation échangent deux fois le
  # même répertoire et laissent une livraison mise de côté que personne ne
  # retrouve. On ne les met pas en file : le second attend le premier.
  group: deploiement-${{ github.event.inputs.cible || 'preprod' }}
  cancel-in-progress: false

jobs:
  # Exactement les contrôles de l'intégration continue, appelés et non recopiés.
  # `ci.yml` et `npm run ci` ont déjà divergé deux fois ; une troisième liste tenue
  # à la main dans un fichier de déploiement est la façon dont un déploiement passe
  # devant une porte que personne n'a pensé à y remettre.
  verifications:
    uses: ./.github/workflows/ci.yml

  preproduction:
    needs: verifications
    # Une poussée sur `main` livre la préproduction, et c'est le seul
    # déploiement automatique de ce dépôt.
    if: github.event_name == 'push' || github.event.inputs.cible == 'preprod'
    runs-on: [self-hosted, o2switch-autorise]
    steps:
      - uses: actions/checkout@v4

      # Pas de setup-node : l'exécutant auto-hébergé a le sien, et une action qui
      # installerait une autre version changerait celle du développeur.
      - run: npm ci

      # UNE SEULE DESCRIPTION DE LA SÉQUENCE. Le script pose, dans cet ordre : le
      # port 22 est-il joignable, la cible est-elle la version attendue, une
      # sauvegarde, l'envoi vers un dépôt d'attente, l'installation (analyse avec
      # le PHP du serveur, échange, activation, migration, sonde, retour arrière
      # automatique si l'une échoue), puis l'état et ce que le portail en dit.
      # ── LE COMMIT, DANS L'EN-TÊTE, AVANT L'ENVOI ────────────────────────────
      #
      # L'écran des extensions annonçait « Teeshoop Core 0.1.0 » sur les deux
      # environnements depuis six mois, donc il ne répondait pas à la seule
      # question qu'on lui pose devant une boutique qui se comporte mal : quel
      # code tourne là. Après cette étape il annonce « 0.1.0+g1a2b3c4 », et ce
      # suffixe est le commit d'où l'envoi est parti.
      #
      # AVANT `deployer.sh` et pas après : c'est le fichier envoyé qui doit le
      # porter. `--verifier` sort 1 si rien n'a été tamponné, donc un tampon qui
      # échoue arrête le déploiement au lieu de le laisser partir anonyme.
      - name: Tamponner le commit dans l'en-tête de l'extension
        run: |
          set -euo pipefail
          node scripts/version-tampon.mjs
          node scripts/version-tampon.mjs --verifier

      - name: Déployer en préproduction
        run: ./scripts/deployer.sh preprod

  production:
    needs: verifications
    if: github.event.inputs.cible == 'prod'
    runs-on: [self-hosted, o2switch-autorise]
    # Un environnement GitHub, pour que la validation manuelle et la liste des
    # personnes qui peuvent la donner vivent dans les réglages du dépôt et non
    # dans ce fichier. À créer : Settings > Environments > production.
    environment: production
    steps:
      # ── LA VALIDATION MANUELLE, ÉCRITE ICI PARCE QUE GITHUB LA REFUSE ────────
      #
      # `environment: production` ci-dessus devait porter une règle « validation
      # requise ». Elle a été demandée par l'API le 02/09/2026 et refusée :
      #
      #   Failed to create the environment protection rule. Please ensure the
      #   billing plan supports the required reviewers protection rule.
      #
      # Les règles de protection d'environnement ne sont pas comprises dans le
      # forfait de ce dépôt privé. L'environnement existe donc et ne protège
      # rien, et un document qui promettrait le contraire serait faux.
      #
      # À la place, une phrase à taper. Ce n'est pas équivalent à une validation
      # par un tiers, et il ne faut pas le lire comme tel : cela n'empêche pas
      # quelqu'un qui a le droit de lancer le travail de le lancer. Cela empêche
      # de le faire par inadvertance, en changeant une liste déroulante sans y
      # penser. La vraie porte reste le portail de mise en ligne, deux étapes
      # plus bas, qui refuse et n'a pas de dérogation.
      - name: Confirmer que la production est bien voulue
        run: |
          set -euo pipefail
          ATTENDU='DEPLOYER-EN-PRODUCTION'
          RECU='${{ github.event.inputs.confirmation }}'
          if [ "$RECU" != "$ATTENDU" ]; then
            echo "Déploiement en PRODUCTION demandé sans confirmation."
            echo "Relancez le travail en tapant $ATTENDU dans le champ « confirmation »."
            echo "Rien n'a été envoyé, rien n'a été touché."
            exit 1
          fi
          echo "Confirmation reçue. La suite reste soumise au portail de mise en ligne."

      - uses: actions/checkout@v4

      - run: npm ci

      # ── LA PORTE, ET ELLE EST FERMÉE AUJOURD'HUI ────────────────────────────
      #
      # C'est la troisième des trois règles écrites le 18 août 2026 quand la
      # décision a été prise de construire les séances 04 à 13 sur des hypothèses
      # plutôt que de s'arrêter :
      #
      #   « La mise en ligne est bloquée automatiquement tant qu'une réponse
      #     bloquante manque sur un nombre qu'un client, un fournisseur ou une
      #     imprimante finit par voir. Ce n'est pas une note dans un document,
      #     c'est un contrôle qui refuse de laisser passer. »
      #
      # Ici, sans `continue-on-error`, avant tout envoi de fichier. Au 2 septembre
      # 2026 il sort 2 (la boutique ne peut pas être interrogée, l'extension n'y
      # est pas) et sortira 1 ensuite, et les deux arrêtent ce travail.
      #
      # IL N'Y A PAS DE DÉROGATION ET IL NE FAUT PAS EN ÉCRIRE UNE. La porte se
      # lève en répondant aux questions qu'elle nomme, et docs/MISE-EN-LIGNE.md
      # dit lesquelles. Une boutique qui déploie par-dessus ce refus publie un
      # prix que personne n'a confirmé.
      # `deploy:` ET NON `ssh:`. La clé de déploiement est posée avec une commande
      # forcée : elle ne peut lancer que les verbes de deploiement.sh, jamais
      # wp-cli. Écrit en `ssh:teeshoop:~/public_html`, ce portail envoyait
      # `cd … && wp teeshoop lancement`, recevait « verbe inconnu », concluait
      # « boutique injoignable » et sortait 2 quel que soit l'état réel de la
      # boutique. Il bloquait donc pour la mauvaise raison, et aurait continué à
      # bloquer le jour où la vraie réponse aurait été « on peut ».
      # Le portail est posé PAR LE SCRIPT, avant tout envoi, et sans dérogation :
      # `deployer.sh prod` sort 2 et n'envoie rien si la boutique n'a pas le
      # droit d'ouvrir. Le refus mesuré le 02/09/2026 : 16 raisons, sortie 2.
      # Même tampon qu'en préproduction, et pour la même raison : les deux
      # environnements reçoivent le même envoi à des moments différents, et le
      # commit est la seule chose qui les distingue.
      - name: Tamponner le commit dans l'en-tête de l'extension
        run: |
          set -euo pipefail
          node scripts/version-tampon.mjs
          node scripts/version-tampon.mjs --verifier

      - name: Déployer en production
        run: ./scripts/deployer.sh prod

  # ── LE STUDIO, SÉPARÉMENT ET À LA MAIN ──────────────────────────────────────
  #
  # `wrangler deploy` publie le bundle sur le Worker Cloudflare, et il n'y a
  # qu'un Worker : ce que ce travail envoie est vu par les clients de la
  # production, quelle que soit la branche d'où il part. Il ne se déclenche donc
  # jamais sur un `push`, et il ne sera automatisable que le jour où il y aura un
  # second environnement Worker pour la préproduction.
  #
  # `npm run deploy` fait la construction, le garde-fou de bundle et l'envoi dans
  # cet ordre, et le garde-fou est ce qui empêche un prix d'achat ou un modèle de
  # coût de partir dans un fichier que le client télécharge.
  # LA CONDITION A ÉTÉ CORRIGÉE AVANT LE PREMIER DÉPLOIEMENT, ET C'ÉTAIT GRAVE.
  #
  # Elle disait seulement `github.event_name == 'workflow_dispatch'`, sans
  # regarder `cible`. Un opérateur qui ouvrait Actions, laissait la valeur par
  # défaut `preprod` et lançait, publiait donc AUSSI le studio sur le Worker de
  # production, au moment précis où il croyait ne toucher que la préproduction.
  # L'en-tête de ce fichier annonçait que cela ne pouvait pas arriver « sur un
  # push » : le push était bien couvert, le dispatch ne l'était pas, et le
  # dispatch est la seule façon de déployer à la main. Trouvé par une relecture
  # adverse.
  studio:
    if: github.event.inputs.cible == 'studio'
    needs: verifications
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      # La version vient de `.nvmrc`, comme dans `ci.yml` : une seule écriture de
      # la version de node dans le dépôt, celle que lisent aussi nvm, fnm et asdf.
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: Le jeton Cloudflare est-il posé
        env:
          JETON: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -n "$JETON" ] || { echo "CLOUDFLARE_API_TOKEN n'est pas posé, le studio ne part pas."; exit 1; }
      - name: Construire, vérifier la frontière, publier
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
