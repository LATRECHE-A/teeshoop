name: CI

# Everything here runs headless in seconds and needs no secrets. The Playwright
# harnesses in scripts/ deliberately stay OUT: they boot a dev server, several
# need a human to look at a screenshot, and scripts/fr-verify.mjs talks to the
# live Falk&Ross account. Same rule for the plugin's WooCommerce integration
# test: it needs a real WordPress and a database, so it runs against wp-local/.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (app + worker)
        run: npm run typecheck && npm run typecheck:worker

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build:only

      # The security gate: proves no purchase price, film cost model or
      # WooCommerce credential path reaches a customer-served file. Must run
      # AFTER the build, and must never be continue-on-error.
      - name: Bundle guard
        run: npm run verify:bundle

  # The WordPress plugin. Its pure classes (Money, Pricing, Margin) call no
  # WordPress function on purpose, so they need PHP and nothing else — the
  # runner exits 2 if it finds no tests, so "scanned nothing" cannot pass.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Lint every PHP file
        run: find wp-plugins -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Plugin unit tests
        run: php wp-plugins/teeshoop-core/tests/run.php
