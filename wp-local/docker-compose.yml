# Local WordPress + WooCommerce, for developing the Teeshoop plugin.
#
# This is NOT staging and NOT production. It exists so the plugin can be written
# and tested before anyone has SSH on o2switch, and so a destructive experiment
# costs a `docker compose down -v` instead of a customer's order history.
#
#   docker compose up -d          then  http://localhost:8080
#   docker compose run --rm wpcli wp plugin list
#   docker compose down -v        wipes it back to nothing
#
# The plugin source is BIND-MOUNTED from the repo: editing wp-plugins/teeshoop-core/
# is immediately live in the container. Nothing WordPress writes ends up in git.
#
# VERSIONS ARE PINNED, and to production's, not to latest. This used to say
# `wordpress:php8.3-apache`, a tag that follows whatever WordPress ships today, so
# the mirror drifted from the shop silently and in a direction nobody chose. On
# 14/08/2026 the shop was measured at WordPress 7.0.4 and WooCommerce 11.0.1;
# the mirror was on 7.0.3. When production moves, this file moves with it, in a
# commit that says so.
#
# ONE GAP REMAINS, AND IT IS THE PHP VERSION. o2switch runs PHP 8.1.34. The
# official WordPress images stop offering php8.1 at WordPress 6.8, so there is no
# 7.0.4-php8.1 to pin to, and this mirror runs 8.3. `npm run test:php` runs on
# whatever PHP the developer has, which today is 8.5. So the plugin's PHP is
# currently exercised on 8.3 and 8.5 and never on the 8.1 that actually serves
# customers: anything using syntax or a function introduced after 8.1 would pass
# every gate here and fatal on the live shop. Until either production is raised
# or a lint against 8.1 is added, that is a known hole, written here rather than
# discovered from a white page on teeshoop.com.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: teeshoop
      MARIADB_USER: teeshoop
      MARIADB_PASSWORD: teeshoop
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      retries: 20

  wp:
    # Pinned to production's WordPress. See the header before changing it.
    image: wordpress:7.0.4-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:80'
    # So PHP inside the container can reach a Worker running on the host.
    # `Design::verify` calls the Cloudflare Worker before it will put a
    # personalised line in a cart, and in development that Worker is
    # `wrangler dev` on the developer's own machine. Without this the plugin
    # would be correct and unexercisable: every design would fail verification
    # for the one reason that is not a bug. scripts/wp-e2e-verify.mjs depends
    # on it, and checks it before it starts a browser.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: teeshoop
      WORDPRESS_DB_USER: teeshoop
      WORDPRESS_DB_PASSWORD: teeshoop
      # WP_DEBUG on, display off: notices land in the log where they can be read,
      # not in the middle of a JSON response where they corrupt it.
      # The catalogue importer's key to our own Worker. It is INTERPOLATED FROM
      # THE DEVELOPER'S ENVIRONMENT and never written here: this file is
      # committed, and the token opens a route that returns our purchase price
      # for every article in the catalogue.
      #
      #   set -x TEESHOOP_CATALOGUE_TOKEN (the ADMIN_TOKEN from .dev.vars)
      #   npm run wp:up
      #
      # Unset, it lands as an empty string and `Supply::unconfigured()` refuses
      # to import, which is the correct behaviour and says which half is
      # missing. It is a constant rather than an option on purpose; see
      # includes/Supply.php.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('TEESHOOP_CATALOGUE_TOKEN', '${TEESHOOP_CATALOGUE_TOKEN:-}');
    volumes:
      - wp:/var/www/html
      - ../wp-plugins/teeshoop-core:/var/www/html/wp-content/plugins/teeshoop-core

  # One-shot WP-CLI, same filesystem and network as the site.
  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      - wp
    user: '33:33'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: teeshoop
      WORDPRESS_DB_USER: teeshoop
      WORDPRESS_DB_PASSWORD: teeshoop
    # The same host mapping as `wp`, and not decoration: anything run here that
    # calls Design::verify reaches the Worker or it does not. Without it the
    # fail-closed path refuses for the wrong reason ("we could not ask" instead
    # of "it does not exist"), and those are different results.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - wp:/var/www/html
      - ../wp-plugins/teeshoop-core:/var/www/html/wp-content/plugins/teeshoop-core
    entrypoint: ['wp']
    command: ['--info']

volumes:
  db:
  wp:
