# Local WordPress + WooCommerce, for developing the Teeshoop plugin.
#
# This is NOT staging and NOT production. It exists so the plugin can be written
# and tested before anyone has SSH on o2switch, and so a destructive experiment
# costs a `docker compose down -v` instead of a customer's order history.
#
#   docker compose up -d          then  http://localhost:8080
#   docker compose run --rm wpcli wp plugin list
#
# THE WORDPRESS ADMIN is `dev`. Set its password yourself with
# `npm run wp:cli -- user update dev --user_pass=...` and keep it out of the
# repository. You need a login to check that an admin screen renders at all,
# which no unit test can do; what you must NOT do is write it into
# `wp-plugins/teeshoop-core/`, because that directory is served by URL on the
# real site and a README in it is a public document.
#   docker compose down -v        wipes it back to nothing
#
# The plugin source is BIND-MOUNTED from the repo: editing wp-plugins/teeshoop-core/
# is immediately live in the container. Nothing WordPress writes ends up in git.
#
# VERSIONS ARE PINNED, and to production's, not to latest. This used to say
# `wordpress:php8.3-apache`, a tag that follows whatever WordPress ships today, so
# the mirror drifted from the shop silently and in a direction nobody chose. On
# 14/08/2026 the shop was measured at WordPress 7.0.4 and WooCommerce 11.0.1;
# the mirror was on 7.0.3. When production moves, this file moves with it, in a
# commit that says so.
#
# 02/09/2026, AND THIS IS THAT COMMIT. Production was re-measured before the first
# deploy and had moved on its own: `wp core version` on o2switch answers 7.1, not
# the 7.0.4 pinned here since 14/08. WooCommerce has not moved (11.0.1 both sides).
# The pin is now 7.1 and the mirror was brought to it, checked by database
# revision and not by the tag: both sides report 61833.
#
# Note for whoever moves it next: changing the tag is not enough. The official
# entrypoint only populates an EMPTY volume, so an existing mirror keeps serving
# the old core files while `docker compose ps` shows the new image. The volume
# was upgraded the way the entrypoint would have, then `wp core update-db`.
#
# THE PHP GAP IS CLOSED, and this paragraph records how rather than deleting the
# warning. o2switch runs PHP 8.1.34, the official WordPress images stop offering
# php8.1 at WordPress 6.8, so there is still no 7.1-php8.1 to pin to and this
# mirror still runs 8.3. What changed is that the plugin no longer goes to
# production having never executed on 8.1: `.github/workflows/ci.yml` runs the
# lint AND the whole PHP suite on `php:8.1-cli`, which is 8.1.34, production's
# exact patch. Measured the day it was added: 550/550 pass on 8.1, and the
# repository contained no construct newer than 8.1 to begin with.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: teeshoop
      MARIADB_USER: teeshoop
      MARIADB_PASSWORD: teeshoop
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      retries: 20

  # THE OBJECT CACHE PRODUCTION ALREADY HAS.
  #
  # o2switch runs Redis 8 on the account, restarted every minute by the account's
  # own crontab, with its socket at ~/.cpanel/redis/redis.sock, and `php -m`
  # there lists redis, memcached and igbinary. None of that existed in this
  # mirror, so an object-cache drop-in was a thing that could be written and
  # deployed and never once exercised. It can now be exercised here.
  #
  # TCP here and a UNIX SOCKET in production, which is the one difference and is
  # deliberate: a socket shared between two containers works but adds a volume
  # and a permissions problem to a mirror, and the drop-in's code path is the
  # same client either way. wp-config.php in the mirror sets WP_REDIS_HOST; on
  # o2switch it sets WP_REDIS_PATH. See docs/PERFORMANCE.md.
  #
  # `--save ''` because nothing in here is worth writing to disk: it is a cache,
  # and a mirror that survives a restart with a stale cache is a mirror that
  # lies. Bounded at 64 Mo with the same eviction policy an object cache wants,
  # so a runaway does not take the machine with it.
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  wp:
    # Pinned to production's WordPress, plus the two PHP extensions o2switch has
    # and the official image does not. See wp-local/Dockerfile.
    build:
      context: .
      dockerfile: Dockerfile
    image: teeshoop/wp-local:7.1-php8.3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8080:80'
    # So PHP inside the container can reach a Worker running on the host.
    # `Design::verify` calls the Cloudflare Worker before it will put a
    # personalised line in a cart, and in development that Worker is
    # `wrangler dev` on the developer's own machine. Without this the plugin
    # would be correct and unexercisable: every design would fail verification
    # for the one reason that is not a bug. scripts/wp-e2e-verify.mjs depends
    # on it, and checks it before it starts a browser.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: teeshoop
      WORDPRESS_DB_USER: teeshoop
      WORDPRESS_DB_PASSWORD: teeshoop
      # WP_DEBUG on, display off: notices land in the log where they can be read,
      # not in the middle of a JSON response where they corrupt it.
      # The catalogue importer's key to our own Worker. It is INTERPOLATED FROM
      # THE DEVELOPER'S ENVIRONMENT and never written here: this file is
      # committed, and the token opens a route that returns our purchase price
      # for every article in the catalogue.
      #
      #   set -x TEESHOOP_CATALOGUE_TOKEN (the ADMIN_TOKEN from .dev.vars)
      #   npm run wp:up
      #
      # Unset, it lands as an empty string and `Supply::unconfigured()` refuses
      # to import, which is the correct behaviour and says which half is
      # missing. It is a constant rather than an option on purpose; see
      # includes/Supply.php.
      #
      # WP_ENVIRONMENT_TYPE, because WordPress answers `production` when nothing
      # says otherwise, and the invoice gate reads it: an incomplete legal
      # identity REFUSES a document in production and merely stamps it anywhere
      # else. Undeclared, this mirror claimed to be the shop and refused to
      # render the very documents it exists to develop. The preproduction is
      # already set to `staging`.
      #
      # WORDPRESS_CONFIG_EXTRA IS ONLY APPLIED WHEN wp-config.php IS CREATED. On
      # a volume that already exists, adding a line here does nothing, silently.
      # For an existing mirror, once:
      #
      #   npm run wp:cli config set WP_ENVIRONMENT_TYPE local --type=constant
      #
      # AND THE MIRROR SPEAKS FRENCH, because the shop does. WordPress and
      # WooCommerce install in en_US, so the checkout said "Checkout", "Subtotal"
      # and "FREE" over amounts written 461,10 €: half of what a French customer
      # reads was never actually rendered anywhere we look. Once:
      #
      #   npm run wp:cli language core install fr_FR --activate
      #   npm run wp:cli language plugin install woocommerce fr_FR
      #
      # AND THE OBJECT CACHE IS NOT AUTOMATIC EITHER. The redis SERVICE and the
      # php extension are in the image (see wp-local/Dockerfile); the drop-in is
      # a plugin and a wp-config constant, so on a volume created before this
      # existed, once:
      #
      #   npm run wp:cli plugin install redis-cache --activate
      #   npm run wp:cli config set WP_REDIS_HOST redis --type=constant
      #   npm run wp:cli config set WP_REDIS_PORT 6379 --raw --type=constant
      #   npm run wp:cli config set WP_REDIS_PREFIX teeshoop_mirror --type=constant
      #   npm run wp:cli redis enable
      #
      # THE PREFIX IS NOT DECORATION. o2switch gives the ACCOUNT one Redis, not
      # the site. Two WordPress installs on one account with no prefix share a
      # keyspace, and the second one's `alloptions` overwrites the first's: two
      # shops answering with each other's settings. `npm run verify:cache`
      # asserts a prefix is set, for that reason and not for tidiness.
      #
      # In production the same three constants exist but WP_REDIS_PATH replaces
      # host and port, because o2switch's Redis listens on a unix socket at
      # ~/.cpanel/redis/redis.sock. See docs/PERFORMANCE.md.
      #
      # AND NO SECRET IS DEFINED HERE, which is a correction and not a style
      # choice. This block used to carry
      #
      #   define('TEESHOOP_CATALOGUE_TOKEN', '${TEESHOOP_CATALOGUE_TOKEN:-}');
      #
      # and the `:-` made it emit an EMPTY define whenever the host had no such
      # variable, which is always. The generated wp-config.php `eval`s this block
      # BEFORE its own hand-written defines, PHP keeps the first definition of a
      # constant, and this service sets the variable while the `wpcli` service
      # does not. So the two containers disagreed about a secret: `wp-cli` read
      # the real 44-character token and every test passed, while the web request
      # read an empty one and the admin screen reported the Worker unreachable.
      # Found on 19/08/2026 by LOOKING at a rendered admin screen, which no test
      # in this repository does.
      #
      # Secrets go in wp-config.php once, where both containers read the same
      # thing:
      #
      #   npm run wp:cli config set TEESHOOP_CATALOGUE_TOKEN <valeur> --type=constant
      #   npm run wp:cli config set TEESHOOP_WORKER_TOKEN <valeur> --type=constant
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - wp:/var/www/html
      - ../wp-plugins/teeshoop-core:/var/www/html/wp-content/plugins/teeshoop-core
      # The theme is ours and lives in the repository too, for the same reason
      # the plugin does: editing it here is immediately live in the container,
      # and nothing WordPress writes ends up in git.
      - ../wp-themes/teeshoop:/var/www/html/wp-content/themes/teeshoop

  # One-shot WP-CLI, same filesystem and network as the site.
  wpcli:
    # Built from the same Dockerfile as `wp`, for one reason: `wp redis status`
    # and every WP-CLI call that goes through the object cache need the redis
    # extension too. On the stock cli image they report the cache as unavailable
    # while the web request uses it, and the two would disagree about whether the
    # shop has an object cache at all.
    build:
      context: .
      dockerfile: Dockerfile.cli
    image: teeshoop/wp-cli-local:php8.3
    depends_on:
      - wp
      - redis
    user: '33:33'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: teeshoop
      WORDPRESS_DB_USER: teeshoop
      WORDPRESS_DB_PASSWORD: teeshoop
    # The same host mapping as `wp`, and not decoration: anything run here that
    # calls Design::verify reaches the Worker or it does not. Without it the
    # fail-closed path refuses for the wrong reason ("we could not ask" instead
    # of "it does not exist"), and those are different results.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - wp:/var/www/html
      - ../wp-plugins/teeshoop-core:/var/www/html/wp-content/plugins/teeshoop-core
      - ../wp-themes/teeshoop:/var/www/html/wp-content/themes/teeshoop
    entrypoint: ['wp']
    command: ['--info']

volumes:
  db:
  wp:
