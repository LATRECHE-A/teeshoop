<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#010050" />
    <meta name="description" content="Votre vêtement Teeshoop en réalité augmentée : posez-le dans votre pièce, à taille réelle, avant de le commander." />
    <title>Teeshoop, essayage en réalité augmentée</title>
    <link rel="icon" href="/icone-teeshoop.png" />
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('tshop:prefs') || '{}')
          document.documentElement.lang = p.lang === 'en' ? 'en' : 'fr'
        } catch (e) {}
      })()
    </script>
    <style>
      /* Les jetons de la boutique (wp-plugins/teeshoop-core/assets/tokens.css),
         recopiés parce que le Worker ne sert pas la feuille du thème. */
      :root {
        --ts-accent: #010050;
        --ts-ink: #242424;
        --ts-muted: #717171;
        --ts-surface: #f6f7f9;
        --ts-line: #dce0e5;
      }
      html, body, #ar-root { height: 100%; margin: 0; }
      body {
        background: var(--ts-surface);
        color: var(--ts-ink); overflow: hidden; overscroll-behavior: none;
        font-family: 'Lato', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      #ar-root { display: flex; flex-direction: column; }
      .vw-head {
        display: flex; align-items: center; gap: 10px; padding: 14px 16px;
        padding-top: max(14px, env(safe-area-inset-top));
        background: #ffffff; border-bottom: 1px solid var(--ts-line);
      }
      .vw-head .brand { display: block; height: 22px; width: auto; }
      .vw-head .sub { color: var(--ts-muted); font-size: 13px; }
      .vw-stage { flex: 1; min-height: 0; position: relative; }
      #vw-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      .vw-foot {
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
      }
      .vw-hint { color: var(--ts-muted); font-size: 13px; text-align: center; max-width: 24rem; line-height: 1.5; }
      .ar-btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 9px;
        border: 1px solid var(--ts-accent); cursor: pointer; border-radius: 10px; text-decoration: none;
        padding: 15px 26px; font-size: 15px; font-weight: 700; color: #ffffff;
        background: var(--ts-accent);
      }
      .ar-btn:focus-visible, .vw-links a:focus-visible, .vw-links button:focus-visible {
        outline: 3px solid var(--ts-accent); outline-offset: 2px;
      }
      .ar-btn svg { width: 20px; height: 20px; }
      .ql-img { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
      .vw-links { display: flex; gap: 18px; margin-top: 2px; }
      .vw-links a, .vw-links button {
        background: none; border: none; cursor: pointer; font: inherit;
        color: var(--ts-accent); font-size: 14px; font-weight: 700; text-decoration: underline;
        display: inline-flex; align-items: center; gap: 6px; padding: 8px 0;
      }
      .vw-center {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 24px; text-align: center;
      }
      .vw-center .big { font-size: 18px; font-weight: 700; }
      .vw-center .muted { color: var(--ts-muted); font-size: 14px; line-height: 1.5; max-width: 22rem; }
    </style>
  </head>
  <body>
    <div id="ar-root"></div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
